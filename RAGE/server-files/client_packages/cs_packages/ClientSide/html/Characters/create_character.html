<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Character</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
        }

        .create-character-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        .create-character-container h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }

        .input-field, .dropdown {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        .create-button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .create-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="create-character-container">
        <h2>Create Character</h2>
        
        <input type="text" id="characterName" class="input-field" placeholder="Character Name" required>
        
        <select id="characterGender" class="dropdown" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>
        
        <button class="create-button" onclick="createCharacter()">Create Character</button>
    </div>

    <script>
        function createCharacter() {
            const name = document.getElementById("characterName").value;
            const gender = document.getElementById("characterGender").value;

            if (name && gender) {
                console.log(`Character created with Name: ${name}, Gender: ${gender}`);
                // Further character creation logic can go here
            } else {
                alert("Please fill in all fields.");
            }
        }
    </script>
</body>
</html>
