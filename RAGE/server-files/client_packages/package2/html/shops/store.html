<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Store Interface</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: rgba(0, 0, 0, 0);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .store-container {
            width: 60%;
            max-width: 900px;
            min-height: 600px;
            max-height: 800px;
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.2);
        }

        .store-header {
            background-color: #000;
            padding: 12px;
            text-align: center;
            border-bottom: 2px solid #ff6600;
        }

        .store-header h1 {
            margin: 0;
            color: #ff6600;
            font-size: 1.5em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .content {
            display: flex;
            padding: 15px;
            gap: 15px;
            flex: 1;
        }

        /* Store Items Section */
        .store-menu {
            width: 65%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            padding: 15px;
            background-color: #1a1a1a;
            border-radius: 12px;
            max-height: 450px;
            overflow-y: auto;
        }

        .store-item {
            height: 120px;
            background-color: #222;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #333;
        }

        .store-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 3px 10px rgba(255, 102, 0, 0.3);
            border-color: #ff6600;
        }

        .item-name {
            font-size: 1em;
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
        }

        .item-price {
            color: #ff6600;
            font-size: 1.1em;
            font-weight: bold;
        }

        /* Cart Section */
        .cart-menu {
            width: 35%;
            background-color: #1a1a1a;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #ff6600;
        }

        .cart-header h2 {
            font-size: 1.2em;
            margin: 0;
        }

        .cart-items-container {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 8px;
            background-color: #222;
            border-radius: 8px;
            max-height: 200px;
        }

        .cart-item {
            background-color: #333;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }

        .cart-item button {
            background-color: #ff3300;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
        }

        .select2-container {
            margin-bottom: 15px;
        }

        .select2-container--default .select2-selection--single {
            background-color: #333;
            border: 1px solid #ff6600;
            border-radius: 6px;
            height: 35px;
        }

        .total {
            font-size: 1.2em;
            margin: 15px 0;
            padding: 10px;
            background-color: #222;
            border-radius: 6px;
            text-align: right;
        }

        .checkout-btn {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .add-item-section {
            padding: 15px;
            background-color: #1a1a1a;
            margin: 15px;
            border-radius: 12px;
        }

        .add-item-form {
            display: none;
            gap: 10px;
            padding: 15px;
            background-color: #222;
            border-radius: 8px;
        }

        .add-item-form input,
        .add-item-form select {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ff6600;
            background-color: #333;
            color: white;
            font-size: 0.9em;
        }

        .add-item-form button,
        .add-item-section > button {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .exit-btn {
            align-self: center;
            margin: 15px;
            padding: 8px 20px;
            background-color: #ff3300;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ff6600;
            border-radius: 3px;
        }
    </style>
</head>
<!-- Rest of the HTML and JavaScript remains the same as in the previous version -->
<body>
    <div class="store-container">
        <div class="store-header">
            <h1>Store</h1>
        </div>
        <div class="content">
            <div class="store-menu" id="store-menu">
                <!-- Store items will be dynamically added here -->
            </div>
            <div class="cart-menu">
                <div class="cart-header">
                    <h2>Shopping Cart</h2>
                </div>
                <div class="cart-items-container" id="cart-items"></div>
                <select id="payment-method" class="dropdown">
                    <option value="cash">Cash</option>
                    <option value="card">Card</option>
                </select>
                <div class="total">Total: $<span id="total-cost">0</span></div>
                <button class="checkout-btn">Checkout</button>
            </div>
        </div>
        <div class="add-item-section">
            <button onclick="toggleAddItemForm()">Add New Item</button>
            <div class="add-item-form" id="add-item-form">
                <input type="text" id="new-item-name" placeholder="Item Name" />
                <input type="number" id="new-item-price" placeholder="Item Price" />
                <select id="new-item-type">
                    <option value="food">Food</option>
                    <option value="drink">Drink</option>
                    <option value="other">Other</option>
                </select>
                <button onclick="addItem()">Add Item</button>
            </div>
        </div>
        <button class="exit-btn" onclick="exitStore()">Exit Store</button>
    </div>

    <script>
        let cart = {};
        let totalCost = 0;

        // Initialize with some sample items
        const initialItems = [
            { name: "Premium Coffee", price: 10 },
            { name: "Artisan Sandwich", price: 15 },
            { name: "Fresh Salad", price: 20 },
            { name: "Gourmet Burger", price: 25 }
        ];

        function initializeStore() {
            const storeMenu = document.getElementById('store-menu');
            initialItems.forEach(item => {
                const newItem = createStoreItem(item.name, item.price);
                storeMenu.appendChild(newItem);
            });
        }

        function createStoreItem(name, price) {
            const div = document.createElement('div');
            div.className = 'store-item';
            div.innerHTML = `
                <span class="item-name">${name}</span>
                <span class="item-price">$${price}</span>
            `;
            div.onclick = () => addToCart(name, price);
            return div;
        }

        function addToCart(item, price) {
            if (cart[item]) {
                cart[item].quantity++;
            } else {
                cart[item] = { price, quantity: 1 };
            }
            totalCost += price;
            updateCart();
        }

        function updateCart() {
            const cartItems = document.getElementById('cart-items');
            const totalCostSpan = document.getElementById('total-cost');

            cartItems.innerHTML = '';
            for (const [item, details] of Object.entries(cart)) {
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <span>${item}</span>
                    <div>
                        <span>$${details.price}</span>
                        <span class="quantity">×${details.quantity}</span>
                        <button onclick="removeFromCart('${item}')">Remove</button>
                    </div>
                `;
                cartItems.appendChild(div);
            }

            totalCostSpan.textContent = totalCost.toFixed(2);
        }

        function removeFromCart(item) {
            if (cart[item]) {
                totalCost -= cart[item].price;
                cart[item].quantity--;
                if (cart[item].quantity <= 0) {
                    delete cart[item];
                }
                updateCart();
            }
        }

        function toggleAddItemForm() {
            const form = document.getElementById('add-item-form');
            form.style.display = form.style.display === 'none' || form.style.display === '' ? 'flex' : 'none';
        }

        function addItem() {
            const name = document.getElementById('new-item-name').value;
            const price = parseFloat(document.getElementById('new-item-price').value);

            if (name && price && price > 0) {
                const storeMenu = document.getElementById('store-menu');
                const newItem = createStoreItem(name, price);
                storeMenu.appendChild(newItem);

                document.getElementById('new-item-name').value = '';
                document.getElementById('new-item-price').value = '';
                toggleAddItemForm();

                saveItemData();
            } else {
                alert('Please enter valid item details.');
            }
        }

        function saveItemData() {
            let itemsList = [];
            const storeItems = document.querySelectorAll('.store-item');

            storeItems.forEach(item => {
                const name = item.querySelector('.item-name').textContent;
                const price = parseFloat(item.querySelector('.item-price').textContent.replace('$', ''));
                const type = 'Food'; // Default type, modify as needed

                itemsList.push({
                    Name: name,
                    Type: type,
                    Cost: price
                });
            });

            const jsonItems = JSON.stringify(itemsList);
            mp.trigger("CEF:CLIENT:SaveItemData", jsonItems);
        }

        function UpdateItems(json) {
            const itemData = JSON.parse(json);
            const storeMenu = document.getElementById('store-menu');
            storeMenu.innerHTML = '';

            itemData.forEach(item => {
                const newItem = createStoreItem(item.Name, item.Cost);
                storeMenu.appendChild(newItem);
            });
        }

        function exitStore() {
            let itemsList = [];
            const storeItems = document.querySelectorAll('.store-item');

            storeItems.forEach(item => {
                const name = item.querySelector('.item-name').textContent;
                const price = parseFloat(item.querySelector('.item-price').textContent.replace('$', ''));
                const type = 'Food'; // Default type, modify as needed

                itemsList.push({
                    Name: name,
                    Type: type,
                    Cost: price
                });
            });

            const jsonItems = JSON.stringify(itemsList);
            mp.trigger("CEF:CLIENT:CloseShop", jsonItems);
            document.querySelector('.store-container').style.display = 'none';
        }

        // Initialize Select2 and store items when document is ready
        $(document).ready(function() {
            $('#payment-method').select2({
                placeholder: "Select payment method",
                allowClear: true
            });

            $('#new-item-type').select2({
                placeholder: "Select item type",
                allowClear: true
            });

            initializeStore();
        });
    </script>
</body>
</html>
