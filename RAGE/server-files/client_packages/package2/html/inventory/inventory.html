<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory System</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: rgba(0, 0, 0, 0);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .inventory-container {
            width: 40%;
            max-width: 600px;
            background-color: #111;
            color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.2);
            position: relative;
        }

        .inventory-header {
            background-color: #000;
            padding: 8px;
            text-align: center;
            border-bottom: 2px solid #ff6600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .inventory-header h1 {
            margin: 0;
            color: #ff6600;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-grow: 1;
        }

        .close-button {
            background: none;
            border: none;
            color: #ff6600;
            cursor: pointer;
            font-size: 1.2em;
            padding: 0 10px;
        }

        .close-button:hover {
            color: #ff8533;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            padding: 10px;
            background-color: #1a1a1a;
            min-height: 300px;
        }

        .inventory-slot {
            aspect-ratio: 1;
            background-color: #222;
            border-radius: 4px;
            border: 1px solid #333;
            position: relative;
            transition: all 0.2s ease;
        }

        .inventory-slot.empty {
            cursor: default;
        }

        .inventory-slot:not(.empty):hover {
            border-color: #ff6600;
            transform: translateY(-2px);
        }

        .item {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 5px;
            box-sizing: border-box;
            position: relative;
            font-size: 0.8em;
            cursor: move;
        }

        .item-id {
            position: absolute;
            top: 2px;
            left: 2px;
            font-size: 0.7em;
            color: #ff6600;
        }

        .item-amount {
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 0.8em;
            color: #fff;
            background-color: rgba(255, 102, 0, 0.8);
            padding: 1px 4px;
            border-radius: 3px;
        }

        .item-name {
            font-weight: bold;
            text-align: center;
            margin-bottom: 2px;
        }

        .item-type {
            font-size: 0.7em;
            color: #888;
        }

        .floating-menu {
            position: fixed;
            background-color: #1a1a1a;
            border: 1px solid #ff6600;
            border-radius: 4px;
            padding: 3px;
            display: none;
            flex-direction: column;
            gap: 2px;
            width: 100px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .floating-menu button {
            background-color: #333;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 0.8em;
            transition: background-color 0.2s;
            text-align: left;
        }

        .floating-menu button:hover {
            background-color: #ff6600;
        }

        .sortable-ghost {
            opacity: 0.5;
        }

        .sortable-chosen {
            background-color: #333;
        }

        .sortable-drag {
            cursor: grabbing;
        }
        /* Add styles for the new modal */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #1a1a1a;
            color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 300px;
            z-index: 2000;
        }

        .modal-header {
            padding: 10px;
            background-color: #000;
            border-bottom: 2px solid #ff6600;
            text-align: center;
        }

        .modal-content {
            padding: 10px;
        }

        .modal-footer {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-top: 1px solid #333;
        }

        .player-list {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .player-list button {
            width: 100%;
            padding: 5px;
            text-align: left;
            border: none;
            background-color: #333;
            color: white;
            margin-bottom: 5px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .player-list button:hover {
            background-color: #ff6600;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider-container input {
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="inventory-container">
        <div class="inventory-header">
            <h1>Inventory</h1>
            <button class="close-button" onclick="closeInventory()">×</button>
        </div>
        <div class="inventory-grid" id="inventory-grid"></div>
    </div>
    <div class="floating-menu" id="floating-menu"></div>

     <!-- Player selection modal -->
     <div class="modal" id="player-modal">
        <div class="modal-header">
            <h3>Select a Player</h3>
        </div>
        <div class="modal-content">
            <div class="player-list" id="player-list"></div>
            <div class="slider-container" id="slider-container" style="display: none;">
                <input type="range" id="amount-slider" min="1" max="1" value="1">
                <span id="slider-value">1</span>
            </div>
        </div>
        <div class="modal-footer">
            <button onclick="closePlayerModal()">Cancel</button>
        </div>
    </div>

    <script>
        let inventoryItems = []; // Will be populated by updateInventory

        function updateInventory(itemDataJson) {
            try {
                const itemData = JSON.parse(itemDataJson);
                inventoryItems = itemData;
                refreshInventoryDisplay();
            } catch (e) {
                console.error('Error parsing inventory data:', e);
            }
        }

        function refreshInventoryDisplay() {
            const grid = document.getElementById('inventory-grid');
            // Clear all slots first
            Array.from(grid.children).forEach(slot => {
                slot.className = 'inventory-slot empty';
                slot.innerHTML = '';
            });

            // Add items to slots
            inventoryItems.forEach((item, index) => {
                if (index < grid.children.length) {
                    const slot = grid.children[index];
                    slot.className = 'inventory-slot';
                    slot.innerHTML = `
                        <div class="item" data-item-id="${item.id}" data-item-type="${item.type}">
                            <span class="item-id">#${item.id}</span>
                            <span class="item-name">${item.name}</span>
                            <span class="item-type">${item.type}</span>
                            <span class="item-amount">${item.amount || 1}</span>
                        </div>
                    `;
                }
            });
        }

        function createInventory() {
            const grid = document.getElementById('inventory-grid');
            for (let i = 0; i < 25; i++) {
                const slot = document.createElement('div');
                slot.className = 'inventory-slot empty';
                slot.dataset.slot = i;
                grid.appendChild(slot);
            }
        }

        function closeInventory() {
            mp.trigger("CEF:CLIENT:CloseInventory");
        }

        function getPrimaryActionText(type) {
            switch(type.toLowerCase()) {
                case 'weapon': return 'Equip';
                case 'food':
                case 'consumable': return 'Use';
                case 'equipment': return 'Wear';
                case 'key': return 'Use';
                default: return 'Use';
            }
        }

        function showFloatingMenu(e, item) {
            if (e.button !== 0) return;
            e.preventDefault();
            const menu = document.getElementById('floating-menu');
            const itemId = item.dataset.itemId;
            const itemType = item.dataset.itemType;

            menu.innerHTML = `
                <button onclick="handleItemAction(${itemId}, '${getPrimaryActionText(itemType).toLowerCase()}')">${getPrimaryActionText(itemType)}</button>
                <button onclick="showItem(${itemId})">Show</button>
                <button onclick="giveItem(${itemId})">Give</button>
                <button onclick="dropItem(${itemId})">Drop</button>
            `;

            const rect = item.getBoundingClientRect();
            
            let top = rect.bottom;
            let left = rect.left;

            if (top + menu.offsetHeight > window.innerHeight) {
                top = rect.top - menu.offsetHeight;
            }
            if (left + menu.offsetWidth > window.innerWidth) {
                left = rect.right - menu.offsetWidth;
            }

            menu.style.top = `${top}px`;
            menu.style.left = `${left}px`;
            menu.style.display = 'flex';
            
            e.stopPropagation();
        }

        function closeFloatingMenu() {
            document.getElementById('floating-menu').style.display = 'none';
        }

        function reorganizeInventory() {
            const grid = document.getElementById('inventory-grid');
            Array.from(grid.children).forEach(slot => {
                slot.className = slot.querySelector('.item') ? 'inventory-slot' : 'inventory-slot empty';
            });
        }

        function initializeSortable() {
            const grid = document.getElementById('inventory-grid');
            
            new Sortable(grid, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                dragClass: 'sortable-drag',
                handle: '.item',
                filter: '.empty', // Prevent dragging empty slots
                onStart: function(evt) {
                    closeFloatingMenu();
                },
                onEnd: function(evt) {
                    const fromSlot = evt.from.children[evt.oldIndex];
                    const toSlot = evt.to.children[evt.newIndex];
                    
                    if (toSlot.querySelector('.item') && fromSlot !== toSlot) {
                        // Revert if target slot is not empty
                        evt.from.insertBefore(evt.item, evt.from.children[evt.oldIndex]);
                    }
                    
                    reorganizeInventory();
                    // Trigger an event to save the new order if needed
                    const newOrder = Array.from(grid.querySelectorAll('.item')).map(item => item.dataset.itemId);
                    mp.trigger("CEF:CLIENT:UpdateInventoryOrder", JSON.stringify(newOrder));
                }
            });
        }

        function handleItemAction(id, action) {
            console.log(`${action} item #${id}`);
            mp.trigger(`CEF:CLIENT:${action.charAt(0).toUpperCase() + action.slice(1)}Item`, id);
            closeFloatingMenu();
        }

        function showItem(id) {
            console.log(`Showing item #${id}`);
            mp.trigger("CEF:CLIENT:ShowItem", id);
            closeFloatingMenu();
        }

        function giveItem(id) {
            console.log(`Giving item #${id}`);
            mp.trigger("CEF:CLIENT:GiveItem", id);
            closeFloatingMenu();
        }

        function dropItem(id) {
            console.log(`Dropping item #${id}`);
            mp.trigger("CEF:CLIENT:DropItem", id);
            const item = document.querySelector(`[data-item-id="${id}"]`);
            if (item) {
                const slot = item.closest('.inventory-slot');
                slot.className = 'inventory-slot empty';
                slot.innerHTML = '';
            }
            reorganizeInventory();
            closeFloatingMenu();
        }

        // Close floating menu when clicking outside
        document.addEventListener('mousedown', e => {
            const clickedItem = e.target.closest('.item');
            const clickedMenu = e.target.closest('.floating-menu');
            
            if (!clickedItem && !clickedMenu) {
                closeFloatingMenu();
            } else if (clickedItem && !clickedMenu && e.button === 0) {
                showFloatingMenu(e, clickedItem);
            }
        });
        let nearbyPlayers = []; // This will be populated by the client-side script

        function populateNearbyPlayers(playersJson) {
            try {
                nearbyPlayers = JSON.parse(playersJson);
            } catch (e) {
                console.error('Error parsing nearby players:', e);
                nearbyPlayers = [];
            }
        }

        function showPlayerModal(action, itemId) {
            const modal = document.getElementById('player-modal');
            const playerList = document.getElementById('player-list');
            const sliderContainer = document.getElementById('slider-container');
            const amountSlider = document.getElementById('amount-slider');
            const sliderValue = document.getElementById('slider-value');

            // Clear previous player list
            playerList.innerHTML = '';

            // Populate player list
            nearbyPlayers.forEach(player => {
                const button = document.createElement('button');
                button.textContent = player.name;
                button.onclick = () => {
                    if (action === 'give') {
                        const amount = parseInt(amountSlider.value, 10);
                        giveItemToPlayer(itemId, player.id, amount);
                    } else if (action === 'show') {
                        showItemToPlayer(itemId, player.id);
                    }
                    closePlayerModal();
                };
                playerList.appendChild(button);
            });

            // Show slider only for "give" action
            if (action === 'give') {
                sliderContainer.style.display = 'flex';
                amountSlider.max = getItemAmount(itemId); // Assuming this function exists to get the item amount
                amountSlider.value = amountSlider.max;
                sliderValue.textContent = amountSlider.value;
                amountSlider.oninput = () => {
                    sliderValue.textContent = amountSlider.value;
                };
            } else {
                sliderContainer.style.display = 'none';
            }

            modal.style.display = 'block';
        }

        function closePlayerModal() {
            const modal = document.getElementById('player-modal');
            modal.style.display = 'none';
        }

        function getItemAmount(itemId) {
            const item = inventoryItems.find(item => item.id === parseInt(itemId, 10));
            return item ? item.amount : 1;
        }

        function showItemToPlayer(itemId, playerId) {
            console.log(`Showing item #${itemId} to player #${playerId}`);
            mp.trigger("CEF:CLIENT:ShowItemToPlayer", itemId, playerId);
        }

        function giveItemToPlayer(itemId, playerId, amount) {
            console.log(`Giving ${amount} of item #${itemId} to player #${playerId}`);
            mp.trigger("CEF:CLIENT:GiveItemToPlayer", itemId, playerId, amount);
        }

        // Example of populating nearby players from client-side:
        populateNearbyPlayers('[{"id":1,"name":"Player1"},{"id":2,"name":"Player2"}]');
        // Initialize the inventory
        createInventory();
        initializeSortable();

        // Example of how to update inventory with new data:
        // updateInventory('[{"id": 1, "name": "Desert Eagle", "type": "weapon", "amount": 1}, {"id": 2, "name": "Medkit", "type": "consumable", "amount": 5}]');
    </script>
</body>
</html>
