<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Character</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0);
        }

        .create-character-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

            .create-character-container h2 {
                margin-bottom: 20px;
                font-size: 24px;
                color: #333;
            }

        .input-field {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        #genderSelection {
            display: flex; /* Use flexbox to align buttons horizontally */
            justify-content: space-between; /* Space between buttons */
            margin: 10px 0; /* Space above and below */
        }

        .gender-button {
            flex: 1; /* Allow buttons to grow equally */
            padding: 10px;
            background-color: #e9e9e9;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 0 5px; /* Space between buttons */
            transition: background-color 0.3s;
        }

            .gender-button.selected {
                background-color: #4CAF50;
                color: white;
            }

        .create-button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

            .create-button:hover {
                background-color: #45a049;
            }

        .error-message {
            color: red;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="create-character-container">
        <h2>Create Character</h2>

        <input type="text" id="firstName" class="input-field" placeholder="First Name" required>
        <input type="text" id="lastName" class="input-field" placeholder="Last Name" required>

        <div id="genderSelection">
            <button id="maleButton" class="gender-button" onclick="selectGender('male')">Male</button>
            <button id="femaleButton" class="gender-button" onclick="selectGender('female')">Female</button>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <button class="create-button" onclick="createCharacter()">Create Character</button>
    </div>

    <script>
        let selectedGender = '';

        function selectGender(gender) {
            selectedGender = gender;

            // Reset button styles
            document.getElementById('maleButton').classList.remove('selected');
            document.getElementById('femaleButton').classList.remove('selected');

            // Set the selected button
            if (gender === 'male') {
                document.getElementById('maleButton').classList.add('selected');
            } else {
                document.getElementById('femaleButton').classList.add('selected');
            }
        }

        function createCharacter() {
            const firstName = document.getElementById("firstName").value;
            const lastName = document.getElementById("lastName").value;

            if (firstName && lastName && selectedGender) {
                console.log(`Character created with Name: ${firstName} ${lastName}, Gender: ${selectedGender}`);
                document.getElementById("errorMessage").innerHTML = ""; // Clear any previous error message

                mp.trigger("CEF:CLIENT:showCustomizeCharScreen");
            } else {
                document.getElementById("errorMessage").innerHTML = "Please fill in all fields.";
                document.getElementById("errorMessage").style.display = "block";
            }
        }
    </script>
</body>
</html>
