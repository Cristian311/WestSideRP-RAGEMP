<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hair</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0); /* Dark background */
            color: #e0e0e0; /* Light text for contrast */
        }
        .container {
            background-color: #1e1e1e; /* Slightly lighter than body background */
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 165, 0, 0.2); /* Orange-tinted shadow */
            padding: 25px;
            width: 350px;
            position: absolute;
            top: 20px;
            left: 20px;
        }
        h2 {
            color: #ff8c00; /* Orange header */
            text-align: center;
            margin-bottom: 20px;
        }
        .slider {
            margin-bottom: 20px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #e0e0e0;
            margin-bottom: 10px;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #444; /* Dark slider track */
            outline: none;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        input[type="range"]:hover {
            opacity: 1;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff8c00; /* Orange slider thumb */
            cursor: pointer;
            box-shadow: 0 0 5px rgba(255, 140, 0, 0.5);
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff8c00; /* Orange slider thumb */
            cursor: pointer;
            box-shadow: 0 0 5px rgba(255, 140, 0, 0.5);
        }
        .button {
            background-color: #ff8c00; /* Orange background */
            color: #121212;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        .button:hover {
            background-color: #ffa500; /* Lighter orange on hover */
            transform: scale(1.05); /* Gentle scale effect */
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
        }
        .extra-slider {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }
        .extra-slider .slider {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
    <div id="page1" class="page" style="display: block;">
        <h2>Character Hair Options</h2>
        
        <!-- Hair -->
        <div class="slider">
            <div class="slider-label">
                <span>Hair</span><span id="hairValue"> 0</span>
            </div>
            <input type="range" id="hair" min="0" max="80" step="1" value="0" oninput="updateCharAttributes()">
        </div>

        <!-- Facial Hair -->
        <div class="slider">
            <div class="slider-label">
                <span>Facial Hair</span><span id="facialHairValue"> 0</span>
            </div>
            <input type="range" id="facialHair" min="0" max="28" step="1" value="0" oninput="updateCharAttributes()">
            <button class="button" onclick="toggleExtraSliders('facialHairExtra')">Customize</button>
        </div>

        <div id="facialHairExtra" class="extra-slider" style="display: none;">
            <div class="slider">
                <span>Color</span><span id="facialHairColorValue"> 0</span>
                <input type="range" min="0" max="63" step="1" value="0" id="facialHairColor" oninput="updateCharAttributes()">
            </div>
            <div class="slider">
                <span>Secondary Color</span><span id="facialHairSecondaryColorValue"> 0</span>
                <input type="range" min="0" max="63" step="1" value="0" id="facialHairSecondaryColor" oninput="updateCharAttributes()">
            </div>
            <div class="slider">
                <span>Opacity</span><span id="facialHairOpacityValue"> 1.00</span>
                <input type="range" min="0" max="1" step="0.05" value="1" id="facialHairOpacity" oninput="updateCharAttributes()">
            </div>
        </div>

        <!-- Eyebrows -->
        <div class="slider">
            <div class="slider-label">
                <span>Eyebrows</span><span id="eyebrowsValue"> 0</span>
            </div>
            <input type="range" id="eyebrows" min="0" max="33" step="1" value="0" oninput="updateCharAttributes()">
            <button class="button" onclick="toggleExtraSliders('eyebrowsExtra')">Customize</button>
        </div>

        <div id="eyebrowsExtra" class="extra-slider" style="display: none;">
            <div class="slider">
                <span>Color</span><span id="eyebrowsColorValue"> 0</span>
                <input type="range" min="0" max="63" step="1" value="0" id="eyebrowsColor" oninput="updateCharAttributes()">
            </div>
            <div class="slider">
                <span>Secondary Color</span><span id="eyebrowsSecondaryColorValue"> 0</span>
                <input type="range" min="0" max="63" step="1" value="0" id="eyebrowsSecondaryColor" oninput="updateCharAttributes()">
            </div>
            <div class="slider">
                <span>Opacity</span><span id="eyebrowsOpacityValue"> 1.00</span>
                <input type="range" min="0" max="1" step="0.05" value="1" id="eyebrowsOpacity" oninput="updateCharAttributes()">
            </div>
        </div>

        <!-- Body Hair -->
        <div class="slider">
            <div class="slider-label">
                <span>Body Hair</span><span id="bodyHairValue"> 0</span>
            </div>
            <input type="range" id="bodyHair" min="0" max="33" step="1" value="0" oninput="updateCharAttributes()">
            <button class="button" onclick="toggleExtraSliders('bodyHairExtra')">Customize</button>
        </div>

        <div id="bodyhairExtra" class="extra-slider" style="display: none;">
            <div class="slider">
                <span>Color</span><span id="bodyHairColorValue"> 0</span>
                <input type="range" min="0" max="63" step="1" value="0" id="bodyHairColor" oninput="updateCharAttributes()">
            </div>
            <div class="slider">
                <span>Secondary Color</span><span id="bodyHairSecondaryColorValue"> 0</span>
                <input type="range" min="0" max="63" step="1" value="0" id="bodyHairSecondaryColor" oninput="updateCharAttributes()">
            </div>
            <div class="slider">
                <span>Opacity</span><span id="bodyHairOpacityValue"> 1.00</span>
                <input type="range" min="0" max="1" step="0.05" value="1" id="bodyHairOpacity" oninput="updateCharAttributes()">
            </div>
        </div>

        <!-- Body Hair -->
        <div class="slider">
            <div class="slider-label">
                <span>Hair Tattoo</span><span id="hairTattooValue">0</span>
            </div>
            <input type="range" id="hairTattoo" min="0" max="33" step="1" value="0" oninput="updateCharAttributes()">
            <button class="button" onclick="toggleExtraSliders('hairTattooExtra')">Customize</button>
        </div>

        <div id="hairTattooExtra" class="extra-slider" style="display: none;">
            <div class="slider">
                <span>Color</span><span id="hairTattooColorValue"> 0</span>
                <input type="range" min="0" max="63" step="1" value="0" id="hairTattooColor" oninput="updateCharAttributes()">
            </div>
            <div class="slider">
                <span>Secondary Color</span><span id="hairTattooSecondaryColorValue"> 0</span>
                <input type="range" min="0" max="63" step="1" value="0" id="hairTattooSecondaryColor" oninput="updateCharAttributes()">
            </div>
            <div class="slider">
                <span>Opacity</span><span id="hairTattooOpacityValue"> 1.00</span>
                <input type="range" min="0" max="1" step="0.05" value="1" id="hairTattooOpacity" oninput="updateCharAttributes()">
            </div>
        </div>
        <button id="editHair" class="button" style="display: block;" onclick="editHair()">Edit</button>
        </div>
        
    </div>
    
<script>
    let currentPage = 0;
    const pages = document.querySelectorAll('.page');
    const prevButton = document.getElementById('prevButton');
    const nextButton = document.getElementById('nextButton');
    const createButton = document.getElementById('createButton');
    function toggleExtraSliders(id) {
        const sliderContainer = document.getElementById(id);
        sliderContainer.style.display = sliderContainer.style.display === 'none' ? 'block' : 'none';
    }

    function showPage(pageIndex) {
        pages.forEach((page, index) => {
            page.style.display = index === pageIndex ? 'block' : 'none';
        });
        updateNavigation();
    }

    function updateNavigation() {
        prevButton.style.display = currentPage === 0 ? 'none' : 'inline-block';
        nextButton.style.display = currentPage === pages.length - 1 ? 'none' : 'inline-block';
        createButton.style.display = currentPage === pages.length - 1 ? 'inline-block' : 'none';
    }

    function prevPage() {
        if (currentPage > 0) {
            currentPage--;
            showPage(currentPage);
        }
    }

    function nextPage() {
        if (currentPage < pages.length - 1) {
            currentPage++;
            showPage(currentPage);
        }
    }

    function updateCharAttributes() {
    const hair = document.getElementById('hair').value;

    const facialHair = document.getElementById('facialHair').value;
    const facialHairColor = document.getElementById('facialHairColor')?.value || 0;
    const facialHairSecondaryColor = document.getElementById('facialHairSecondaryColor')?.value || 0;
    const facialHairOpacity = document.getElementById('facialHairOpacity')?.value || 1;

    const eyebrows = document.getElementById('eyebrows').value;
    const eyebrowsColor = document.getElementById('eyebrowsColor')?.value || 0;
    const eyebrowsSecondaryColor = document.getElementById('eyebrowsSecondaryColor')?.value || 0;
    const eyebrowsOpacity = document.getElementById('eyebrowsOpacity')?.value || 1;

    const bodyHair = document.getElementById('bodyHair').value;
    const bodyHairColor = document.getElementById('bodyHairColor')?.value || 0;
    const bodyHairSecondaryColor = document.getElementById('bodyHairSecondaryColor')?.value || 0;
    const bodyHairOpacity = document.getElementById('bodyHairOpacity')?.value || 1;

    const hairTattoo = document.getElementById('hairTattoo').value;
    const hairTattooColor = document.getElementById('hairTattooColor')?.value || 0;
    const hairTattooSecondaryColor = document.getElementById('hairTattooSecondaryColor')?.value || 0;
    const hairTattooOpacity = document.getElementById('hairTattooOpacity')?.value || 1;

    // Update the displayed values
    document.getElementById('hairValue').textContent = hair;
    document.getElementById('facialHairValue').textContent = facialHair;
    document.getElementById('eyebrowsValue').textContent = eyebrows;
    document.getElementById('bodyHairValue').textContent = bodyHair;
    document.getElementById('hairTattooValue').textContent = hairTattoo;

    // Create the hair data object with all attributes and colors
    const hairData = {
        hair: hair,
        facialHair: {
            value: facialHair,
            color: facialHairColor,
            secondaryColor: facialHairSecondaryColor,
            opacity: facialHairOpacity
        },
        eyebrows: {
            value: eyebrows,
            color: eyebrowsColor,
            secondaryColor: eyebrowsSecondaryColor,
            opacity: eyebrowsOpacity
        },
        bodyHair: {
            value: bodyHair,
            color: bodyHairColor,
            secondaryColor: bodyHairSecondaryColor,
            opacity: bodyHairOpacity
        },
        hairTattoo: hairTattoo
    };

    const jsonString = JSON.stringify(hairData);
    mp.trigger("CEF:CLIENT:UpdateHair", jsonString);
    }


    function editHair() {
    const hair = document.getElementById('hair').value;

    const facialHair = document.getElementById('facialHair').value;
    const facialHairColor = document.getElementById('facialHairColor')?.value || 0;
    const facialHairSecondaryColor = document.getElementById('facialHairSecondaryColor')?.value || 0;
    const facialHairOpacity = document.getElementById('facialHairOpacity')?.value || 1;

    const eyebrows = document.getElementById('eyebrows').value;
    const eyebrowsColor = document.getElementById('eyebrowsColor')?.value || 0;
    const eyebrowsSecondaryColor = document.getElementById('eyebrowsSecondaryColor')?.value || 0;
    const eyebrowsOpacity = document.getElementById('eyebrowsOpacity')?.value || 1;

    const bodyHair = document.getElementById('bodyHair').value;
    const bodyHairColor = document.getElementById('bodyHairColor')?.value || 0;
    const bodyHairSecondaryColor = document.getElementById('bodyHairSecondaryColor')?.value || 0;
    const bodyHairOpacity = document.getElementById('bodyHairOpacity')?.value || 1;

    const hairTattoo = document.getElementById('hairTattoo').value;
    const hairTattooColor = document.getElementById('hairTattooColor')?.value || 0;
    const hairTattooSecondaryColor = document.getElementById('hairTattooSecondaryColor')?.value || 0;
    const hairTattooOpacity = document.getElementById('hairTattooOpacity')?.value || 1;

    // Update the displayed values
    document.getElementById('hairValue').textContent = hair;
    document.getElementById('facialHairValue').textContent = facialHair;
    document.getElementById('eyebrowsValue').textContent = eyebrows;
    document.getElementById('bodyHairValue').textContent = bodyHair;
    document.getElementById('hairTattooValue').textContent = hairTattoo;

    // Create the hair data object with all attributes and colors
    const hairData = {
        hair: hair,
        facialHair: {
            value: facialHair,
            color: facialHairColor,
            secondaryColor: facialHairSecondaryColor,
            opacity: facialHairOpacity
        },
        eyebrows: {
            value: eyebrows,
            color: eyebrowsColor,
            secondaryColor: eyebrowsSecondaryColor,
            opacity: eyebrowsOpacity
        },
        bodyHair: {
            value: bodyHair,
            color: bodyHairColor,
            secondaryColor: bodyHairSecondaryColor,
            opacity: bodyHairOpacity
        },
        hairTattoo: {
            value: hairTattoo
        }
    };

    const jsonString = JSON.stringify(hairData);
    mp.trigger("CEF:CLIENT:UpdateHair", jsonString);
        mp.trigger("CEF:CLIENT:StopHairScreen", jsonString);
    }

    function updateHairDataFromJson(jsonString) {
            // Parse the JSON string to convert it into an object
            const hairData = JSON.parse(jsonString);

            // Update all sliders and their corresponding value displays
            const sliderMappings = [
                { id: 'hair', value: hairData.hair },
                { id: 'facialHair', value: hairData.facialHair.value },
                { id: 'facialHairColor', value: hairData.facialHair.color },
                { id: 'facialHairSecondaryColor', value: hairData.facialHair.secondaryColor },
                { id: 'facialHairOpacity', value: hairData.facialHair.opacity },
                { id: 'eyebrows', value: hairData.eyebrows.value },
                { id: 'eyebrowsColor', value: hairData.eyebrows.color },
                { id: 'eyebrowsSecondaryColor', value: hairData.eyebrows.secondaryColor },
                { id: 'eyebrowsOpacity', value: hairData.eyebrows.opacity },
                { id: 'bodyHair', value: hairData.bodyHair.value },
                { id: 'bodyHairColor', value: hairData.bodyHair.color },
                { id: 'bodyHairSecondaryColor', value: hairData.bodyHair.secondaryColor },
                { id: 'bodyHairOpacity', value: hairData.bodyHair.opacity },
                { id: 'hairTattoo', value: hairData.hairTattoo.value }
            ];

            // Update sliders and their display values
            sliderMappings.forEach(mapping => {
                const slider = document.getElementById(mapping.id);
                const valueDisplay = document.getElementById(`${mapping.id}Value`);
                
                if (slider) {
                    slider.value = mapping.value;
                }
                
                if (valueDisplay) {
                    valueDisplay.textContent = mapping.value;
                }
            });

            // Trigger update to ensure all visual elements are synchronized
            updateCharAttributes();
        }
    showPage(currentPage); // Initial page load
</script>

</body>
</html>
