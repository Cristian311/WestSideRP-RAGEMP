<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider JSON Generator</title>
    <style>
    body {
        display: flex;
        justify-content: space-between;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: rgba(0, 0, 0, 0);
        color: #ffffff;
    }

    .left-menu, .menu {
        display: flex;
        flex-direction: column;
        gap: 15px;
        padding: 25px;
        background-color: rgba(18, 18, 18, 0.95);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 102, 0, 0.1);
    }

    .button, .left-button {
        padding: 15px 20px;
        background-color: #1a1a1a;
        color: #ff6600;
        border: 2px solid #ff6600;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        text-align: center;
        transition: all 0.3s ease;
        width: 100%;
        box-sizing: border-box;
        white-space: nowrap;
    }

    .button:hover, .left-button:hover {
        background-color: #ff6600;
        color: #1a1a1a;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
    }

    .button.active {
        background-color: #ff6600;
        color: #1a1a1a;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
    }

    .slider-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
    }

    .slider-control {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .arrow-button {
        padding: 5px 10px;
        background-color: #1a1a1a;
        color: #ff6600;
        border: 1px solid #ff6600;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.3s ease;
    }

    .arrow-button:hover {
        background-color: #ff6600;
        color: #1a1a1a;
    }

    .slider-label {
        color: #ff6600;
        font-weight: 600;
        font-size: 14px;
    }

    .value-display {
        color: #ffffff;
        font-weight: 600;
        font-size: 14px;
        min-width: 30px;
        text-align: center;
    }

    input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        height: 6px;
        background: #333333;
        border-radius: 3px;
        outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        background: #ff6600;
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    input[type="text"] {
        width: 100%;
        padding: 8px;
        background-color: #1a1a1a;
        border: 1px solid #ff6600;
        border-radius: 4px;
        color: #ffffff;
        margin-top: 5px;
    }

    .outfit-name-container {
        margin-top: 10px;
        width: 100%;
    }

    .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
    }

    .button-row .button {
        flex: 1;
        min-width: 120px;
        font-size: 14px;
    }

    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(255, 102, 0, 0.4); }
        70% { box-shadow: 0 0 0 10px rgba(255, 102, 0, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255, 102, 0, 0); }
    }

    .button.active {
        animation: pulse 2s infinite;
    }
</style>

<body>
    <!-- Left Menu -->
    <div class="left-menu">
        <button class="left-button" onclick="selectCharacter()">Select Costume</button>
        <div class="slider-group-left">
            <input type="range" min="0" max="10" value="0" class="slider" id="character-select" oninput="updateCharacterValue()">
            <span class="value-display" id="character-select-value">0</span>
        </div>
        <div class="outfit-name-container">
            <input type="text" id="outfit-name" placeholder="Outfit Name" onchange="updateOutfitName()">
        </div>
        <button class="left-button" onclick="buyItem()">Buy</button>
        <button class="left-button" onclick="exitMenu()">Exit</button>
    </div>

    <!-- Right Menu -->
    <div class="menu">
        <!-- Buttons to Select Items -->
        <div class="button-row">
            <button class="button" onclick="selectItem('decals')">Decals</button>
            <button class="button" onclick="selectItem('masks')">Masks</button>
            <button class="button" onclick="selectItem('torsos')">Torsos</button>
        </div>
        <div class="button-row">
            <button class="button" onclick="selectItem('legs')">Legs</button>
            <button class="button" onclick="selectItem('bags')">Bags</button>
            <button class="button" onclick="selectItem('shoes')">Shoes</button>
        </div>
        <div class="button-row">
            <button class="button" onclick="selectItem('accessories')">Accessories</button>
            <button class="button" onclick="selectItem('undershirts')">Undershirts</button>
            <button class="button" onclick="selectItem('bodyArmor')">Body Armors</button>
        </div>
        <div class="button-row">
            <button class="button" onclick="selectItem('shirts')">Shirts and Jackets</button>
            <button class="button" onclick="selectItem('helmets')">Helmets</button>
            <button class="button" onclick="selectItem('glasses')">Glasses</button>
        </div>
        <div class="button-row">
            <button class="button" onclick="selectItem('earAccesories')">Ear Accessories</button>
            <button class="button" onclick="selectItem('watches')">Watches</button>
            <button class="button" onclick="selectItem('bracelets')">Bracelets</button>
        </div>

        <!-- Sliders for drawable and texture -->
        <div class="slider-container">
            <label class="slider-label">Piece:</label>
            <div class="slider-control">
                <button class="arrow-button" onclick="adjustSlider('drawable', -1)">←</button>
                <input type="range" min="0" value="0" class="slider" id="drawable-slider" oninput="updateValue('drawable')">
                <button class="arrow-button" onclick="adjustSlider('drawable', 1)">→</button>
                <span class="value-display" id="drawable-value">0</span>
            </div>
        </div>
        <div class="slider-container">
            <label class="slider-label">Texture:</label>
            <div class="slider-control">
                <button class="arrow-button" onclick="adjustSlider('texture', -1)">←</button>
                <input type="range" min="0" max="30" value="0" class="slider" id="texture-slider" oninput="updateValue('texture')">
                <button class="arrow-button" onclick="adjustSlider('texture', 1)">→</button>
                <span class="value-display" id="texture-value">0</span>
            </div>
        </div>
    </div>

    <script>
    // Initialize data structure
    const itemData = {
        id: 0,
        outfitName: "",
        decals: { drawable: 0, texture: 0 },
        masks: { drawable: 0, texture: 0 },
        torsos: { drawable: 0, texture: 0 },
        legs: { drawable: 0, texture: 0 },
        bags: { drawable: 0, texture: 0 },
        shoes: { drawable: 0, texture: 0 },
        accessories: { drawable: 0, texture: 0 },
        undershirts: { drawable: 0, texture: 0 },
        bodyArmor: { drawable: 0, texture: 0 },
        shirts: { drawable: 0, texture: 0 },
        helmets: { drawable: -1, texture: 0 },
        glasses: { drawable: -1, texture: 0 },
        earAccesories: { drawable: -1, texture: 0 },
        watches: { drawable: -1, texture: 0 },
        bracelets: { drawable: -1, texture: 0 }
    };

    // Store outfit names
    const outfitNames = {};

    // Map of item types to their JSON file names
    const itemTypeToJsonMap = {
        masks: 'masks.json',
        torsos: '_male_torsos.json',
        legs: '_male_legs.json',
        bags: 'bags.json',
        shoes: '_male_shoes.json',
        accessories: '_male_accessories.json',
        undershirts: '_male_undershirts.json',
        bodyArmor: 'bodyArmor.json',
        shirts: '_male_tops.json',
        helmets: 'props_male_hats.json',
        glasses: 'props_male_glasses.json',
        earAccesories: 'props_male_ears.json',
        watches: 'props_male_watches.json',
        bracelets: 'props_male_bracelets.json'
    };

    // Store the texture limits for each drawable of each item type
    const itemTextureMaxValues = {};

    // Function to adjust slider value using arrow buttons
    function adjustSlider(type, change) {
        const slider = document.getElementById(`${type}-slider`);
        const currentValue = parseInt(slider.value);
        const newValue = currentValue + change;
        
        if (newValue >= parseInt(slider.min) && newValue <= parseInt(slider.max)) {
            slider.value = newValue;
            updateValue(type);
        }
    }

    // Function to update outfit name
    function updateOutfitName() {
        const name = document.getElementById('outfit-name').value;
        const outfitId = document.getElementById('character-select').value;
        outfitNames[outfitId] = name;
        itemData.outfitName = name;
        mp.trigger("CEF:CLIENT:UpdateClothes", getItemDataJSON());
    }

    // Function to update max values dynamically from the passed JSON string
    function updateMaxValuesFromJSON(jsonString) {
        try {
            const jsonData = JSON.parse(jsonString);
            
            for (const [filename, data] of Object.entries(jsonData)) {
                const itemType = Object.entries(itemTypeToJsonMap).find(([_, val]) => val === filename)?.[0];
                
                if (itemType && data.DrawableSummaries) {
                    itemTextureMaxValues[itemType] = {};
                    
                    Object.entries(data.DrawableSummaries).forEach(([drawable, textureCount]) => {
                        itemTextureMaxValues[itemType][parseInt(drawable)] = textureCount;
                    });
                    
                    if (itemType === selectedItem) {
                        const maxDrawable = Math.max(...Object.keys(data.DrawableSummaries).map(Number));
                        document.getElementById('drawable-slider').max = maxDrawable;
                    }
                }
            }
            
            if (selectedItem) {
                updateMaxTexture(selectedItem);
            }
        } catch (error) {
            console.error('Error parsing JSON:', error);
        }
    }

    // Function to update the max texture value based on the drawable
    function updateMaxTexture(itemType) {
        if (!itemTextureMaxValues[itemType]) return;
        
        const currentDrawable = itemData[itemType].drawable;
        const maxTextureValue = itemTextureMaxValues[itemType][currentDrawable] || 0;
        
        const textureSlider = document.getElementById('texture-slider');
        textureSlider.max = maxTextureValue - 1;
        
        itemData[itemType].texture = Math.min(itemData[itemType].texture, maxTextureValue - 1);
        textureSlider.value = itemData[itemType].texture;
        document.getElementById('texture-value').textContent = itemData[itemType].texture;
    }

    function UpdateClothes(json) {
        const data = JSON.parse(json);
        
        Object.keys(data).forEach(key => {
            if (key in itemData) {
                if (key === 'outfitName') {
                    itemData[key] = data[key];
                    document.getElementById('outfit-name').value = data[key];
                } else if (typeof data[key] === 'object' && data[key] !== null) {
                    Object.keys(data[key]).forEach(nestedKey => {
                        itemData[key][nestedKey] = data[key][nestedKey];
                        
                        if (key === selectedItem) {
                            if (nestedKey === 'drawable') {
                                document.getElementById('drawable-slider').value = itemData[key][nestedKey];
                                document.getElementById('drawable-value').textContent = itemData[key][nestedKey];
                            } else if (nestedKey === 'texture') {
                                document.getElementById('texture-slider').value = itemData[key][nestedKey];
                                document.getElementById('texture-value').textContent = itemData[key][nestedKey];
                            }
                        }
                    });
                } else {
                    itemData[key] = data[key];
                    
                    if (key === 'id') {
                        document.getElementById('character-select').value = itemData[key];
                        document.getElementById('character-select-value').textContent = itemData[key];
                        // Update outfit name when switching outfits
                        document.getElementById('outfit-name').value = outfitNames[itemData[key]] || '';
                    }
                }
            }
        });
    }

    // Function to select an item
    let selectedItem = "shirts";
    
    function selectItem(item) {
        selectedItem = item;
        
        // Get the maximum drawable value for the selected item
        const maxDrawable = Math.max(...Object.keys(itemTextureMaxValues[item] || {}).map(Number));
        
        // Determine minimum and default drawable values
        const isSpecialItem = ["helmets", "glasses", "earAccesories", "watches", "bracelets"].includes(item);
        const minDrawable = isSpecialItem ? -1 : 0;
        const defaultDrawable = itemData[item].drawable; // Use current value instead of resetting
        
        // Update the drawable slider
        const drawableSlider = document.getElementById('drawable-slider');
        drawableSlider.min = minDrawable;
        drawableSlider.max = maxDrawable;
        drawableSlider.value = defaultDrawable;
        document.getElementById('drawable-value').textContent = defaultDrawable;
        
        // Update the texture slider based on the current drawable
        updateMaxTexture(item);
        
        // Remove 'active' class from all buttons
        const buttons = document.querySelectorAll('.button');
        buttons.forEach(button => button.classList.remove('active'));
        
        // Add 'active' class to the clicked button
        const clickedButton = document.querySelector(`.button[onclick="selectItem('${item}')"]`);
        if (clickedButton) {
            clickedButton.classList.add('active');
        }
    }

    // Function to update the value of drawable or texture for the selected item
    function updateValue(type) {
        if (!selectedItem) return;
        
        const value = parseInt(document.getElementById(`${type}-slider`).value);
        itemData[selectedItem][type] = value;
        
        // If drawable was changed, update the texture limits
        if (type === 'drawable') {
            updateMaxTexture(selectedItem);
        }
        
        document.getElementById(`${type}-value`).textContent = value;
        
        // Trigger any necessary actions based on updated data
        mp.trigger("CEF:CLIENT:UpdateClothes", getItemDataJSON());
    }

    function updateCharacterValue() {
        const value = document.getElementById('character-select').value;
        document.getElementById('character-select-value').textContent = value;
        itemData.id = parseInt(value);
        
        // Update outfit name when switching characters
        document.getElementById('outfit-name').value = outfitNames[value] || '';
        itemData.outfitName = outfitNames[value] || '';
        
        // Trigger update
        mp.trigger("CEF:CLIENT:UpdateClothes", getItemDataJSON());
    }

    function getItemDataJSON() {
        return JSON.stringify(itemData, null, 2);
    }

    function selectCharacter() {
        const value = document.getElementById('character-select').value;
        mp.trigger("CEF:CLIENT:SelectCostume", value);
    }

    function buyItem() {
        mp.trigger("CEF:CLIENT:BuyCostume", getItemDataJSON());
    }

    function exitMenu() {
        mp.trigger("CEF:CLIENT:CloseClothesScreen");
    }

    // Initialize the interface
    document.addEventListener('DOMContentLoaded', function() {
        selectItem('shirts'); // Set initial selection to shirts
        updateCharacterValue(); // Initialize character value
    });
    </script>
</body>
</html>
