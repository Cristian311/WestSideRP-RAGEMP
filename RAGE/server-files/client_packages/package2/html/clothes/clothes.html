<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider JSON Generator</title>
    <style>
/* General body styling */
/* General body styling */
body {
    display: flex;
    justify-content: space-between;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: rgba(0, 0, 0, 0); /* Light background with an orange tint */
}

/* Left and right menus inside boxes with grey background */
.left-menu, .menu {
    display: flex;
    flex-direction: column;
    gap: 15px;
    padding: 20px;
    background-color: #fff5e6; /* Light orange background for the menu */
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
}

/* Button Styling for both left and right menus */
.button, .left-button {
    padding: 15px 20px; /* Bigger buttons */
    background-color: #ffa500; /* Orange background */
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px; /* Slightly bigger font for better readability */
    text-align: center;
    transition: background-color 0.3s ease, transform 0.2s ease;
    width: 100%; /* Buttons span the entire width on the left menu */
    box-sizing: border-box;
    white-space: nowrap; /* Prevent text from wrapping */
}

.button:hover, .left-button:hover {
    background-color: #ff7f00; /* Darker orange on hover */
    transform: scale(1.05); /* Slight zoom effect on hover */
}

/* For the left menu buttons, ensure they are stacked vertically */
.left-menu .button, .left-menu .left-button {
    margin-bottom: 10px;
}

/* For the right menu buttons, place 3 buttons in a row */
.menu {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* 3 buttons per row */
    gap: 15px; /* Increase gap for better spacing */
}

/* Slider Group Styling */
.slider-container, .slider-group-left {
    display: flex;
    flex-direction: column; /* Sliders should be stacked vertically */
    align-items: flex-start; /* Align sliders to the left */
    margin-bottom: 20px; /* Space between sliders */
}

.value-display {
    margin-top: 5px;
    font-weight: bold;
    font-size: 14px;
}

/* Slider styling */
.slider {
    width: 100%;
    margin-bottom: 10px; /* Space between sliders */
}

/* Specific styling for the left menu sliders */
.left-menu .slider-group-left {
    margin-top: 20px; /* Add space above sliders */
}



    </style>
</head>
<body>
    <!-- Left Menu -->
    <div class="left-menu">
        <button class="left-button" onclick="selectCharacter()">Select Costume</button>
        <div class="slider-group-left">
            <input type="range" min="0" max="10" value="0" class="slider" id="character-select" oninput="updateCharacterValue()">
            <span class="value-display" id="character-select-value">0</span>
        </div>
        <button class="left-button" onclick="buyItem()">Buy</button>
        <button class="left-button" onclick="exitMenu()">Exit</button>
    </div>

    <!-- Right Menu -->
    <div class="menu">
        <!-- Buttons to Select Items -->
        <button class="button" onclick="selectItem('decals')">Decals</button>
        <button class="button" onclick="selectItem('masks')">Masks</button>
        <button class="button" onclick="selectItem('torsos')">Torsos</button>
        <button class="button" onclick="selectItem('legs')">Legs</button>
        <button class="button" onclick="selectItem('bags')">Bags</button>
        <button class="button" onclick="selectItem('shoes')">Shoes</button>
        <button class="button" onclick="selectItem('accessories')">Accessories</button>
        <button class="button" onclick="selectItem('undershirts')">Undershirts</button>
        <button class="button" onclick="selectItem('bodyArmor')">Body Armors</button>
        <button class="button" onclick="selectItem('shirts')">Shirts and Jackets</button>
        <button class="button" onclick="selectItem('helmets')">Helmets</button>
        <button class="button" onclick="selectItem('glasses')">Glasses</button>
        <button class="button" onclick="selectItem('earAccessories')">Ear Accessories</button>
        <button class="button" onclick="selectItem('watches')">Watches</button>
        <button class="button" onclick="selectItem('bracelets')">Bracelets</button>
        <div></div>
        <!-- Sliders for drawable and texture -->
        <div class="slider-container">
            <label class="slider-label">Piece:</label>
            <input type="range" min="0" value="0" class="slider" id="drawable-slider" oninput="updateValue('drawable')">
            <span class="value-display" id="drawable-value">0</span>
        </div>
        <div class="slider-container">
            <label class="slider-label">Texture:</label>
            <input type="range" min="0" max="30" value="0" class="slider" id="texture-slider" oninput="updateValue('texture')">
            <span class="value-display" id="texture-value">0</span>
        </div>

        <!-- Button to Get JSON -->
        <button onclick="console.log(getItemDataJSON())" class="button">Log JSON</button>
    </div>

    <script>
        // Initialize data structure
        const itemData = {
            id: 0,
            decals: { drawable: 0   , texture: 0 },
            masks: { drawable: 0, texture: 0 },
            torsos: { drawable: 0, texture: 0 },
            legs: { drawable: 0, texture: 0 },
            bags: { drawable: 0, texture: 0 },
            shoes: { drawable: 0, texture: 0 },
            accessories: { drawable: 0, texture: 0 },
            undershirts: { drawable: 0, texture: 0 },
            bodyArmor: { drawable: 0, texture: 0 },
            shirts: { drawable: 0, texture: 0 },
            helmets: { drawable: 0, texture: 0 },
            glasses: { drawable: 0, texture: 0 },
            earAccesories: { drawable: 0, texture: 0 },
            watches: { drawable: 0, texture: 0 },
            bracelets: { drawable: 0, texture: 0 }
        };
        const itemMaxValues = {
            decals: 100,
            masks: 197,
            torsos: 241,
            legs: 150,
            bags: 99,
            shoes: 105,
            accessories: 151,
            undershirts: 233,
            bodyArmor: 30,
            shirts: 414,
            helmets: 163,
            glasses: 41,
            earAccesories: 40,
            watches: 40,
            bracelets: 16
        };

        let selectedItem = "decals"; // Default selected item

        // Function to select an item
        function selectItem(item) {
            selectedItem = item;
            document.getElementById('drawable-slider').max = itemMaxValues[item];
            document.getElementById('drawable-slider').value = itemData[item].drawable;
            document.getElementById('texture-slider').value = itemData[item].texture;
            document.getElementById('drawable-value').textContent = itemData[item].drawable;
            document.getElementById('texture-value').textContent = itemData[item].texture;
        }

        // Function to update the value of drawable or texture for the selected item
        function updateValue(type) {
            const value = document.getElementById(`${type}-slider`).value;
            itemData[selectedItem][type] = parseInt(value, 10);
            itemData.id = document.getElementById('character-select').value;
            document.getElementById(`${type}-value`).textContent = value;
            mp.trigger("CEF:CLIENT:updateClothes", getItemDataJSON());
        }

        // Function to update the character selection slider
        function updateCharacterValue() {
            const value = document.getElementById('character-select').value;
            document.getElementById('character-select-value').textContent = value;
        }
        function UpdateClothes(json)
        {
            const data = JSON.parse(json);
            itemData = data;
        }
        // Function to get JSON representation of the data
        function getItemDataJSON() {
            return JSON.stringify(itemData, null, 2);
        }

        // Placeholder functions for left menu buttons
        function selectCharacter() { 
            const value = document.getElementById('character-select').value;
            mp.trigger("CEF:CLIENT:SelectCostume", value);
        }
        function buyItem() { 
            const value = document.getElementById('character-select').value;
            mp.trigger("CEF:CLIENT:BuyCostume", getItemDataJSON());
        }
        function exitMenu() { mp.trigger("CEF:CLIENT:closeClothesScreen"); }
    </script>
</body>
</html>
