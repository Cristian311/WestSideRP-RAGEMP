<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tattoo Zone Selector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-start; /* Align to left */
            align-items: center;
            height: 100vh;
        }

        .box {
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 300px;
            text-align: center;
        }

        .box h1 {
            color: orange;
            margin-bottom: 20px;
        }

        .slider-label {
            color: #fff;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #555;
            outline: none;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: orange;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: orange;
            cursor: pointer;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        button {
            background-color: orange;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            color: #fff;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #ff8c00;
        }

        button:disabled {
            background-color: grey;
            cursor: not-allowed;
        }

        .slider-value {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Tattoo Selector</h1>
        
        <label for="zone-slider" class="slider-label">Zone:</label>
        <input type="range" id="zone-slider" min="1" max="3" value="1" step="1">
        <span id="zone-label" class="slider-value">Zone 1</span>
        
        <label for="tattoo-slider" class="slider-label">Tattoo:</label>
        <input type="range" id="tattoo-slider" min="1" max="5" value="1" step="1">
        <span id="tattoo-label" class="slider-value">Tattoo 1</span>

        <div class="buttons">
            <button id="apply-btn" disabled>Apply</button>
            <button id="remove-btn">Remove</button>
        </div>
    </div>
</body>
</html>
