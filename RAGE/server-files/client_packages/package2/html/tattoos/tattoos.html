<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-start; /* Align to left */
            align-items: center;
            height: 100vh;
        }
    
        .box {
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 300px;
            text-align: center;
        }
    
        .box h1 {
            color: orange;
            margin-bottom: 20px;
        }
    
        .slider-label {
            color: #fff;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }
    
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #555;
            outline: none;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
    
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: orange;
            cursor: pointer;
        }
    
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: orange;
            cursor: pointer;
        }
    
        /* Add margin to space out the tattoo slider section */
        .tattoo-section {
            margin-top: 20px; /* Increase this value to push it further down */
        }
    
        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
    
        button {
            background-color: orange;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            color: #fff;
            font-weight: bold;
            transition: background-color 0.3s;
        }
    
        button:hover {
            background-color: #ff8c00;
        }
    
        .slider-value {
            color: #fff;
            font-weight: bold;
        }
    
        .highlighted {
            color: green;
            font-weight: bold;
        }
    </style>

            <label class="slider-label" for="zone-slider">Zone:</label>

            <!-- Add a container for the tattoo section to apply margin -->

                <div class="slider-value" id="tattoo-name">Mk II Girl</div>
            </div>
    
            <div class="buttons">
                <button id="apply-button">Apply</button>
                <button id="remove-button">Remove</button>
                <button id="exit-button"> Exit</button>
            </div>
        </div>
    </body>

        const zones = Object.keys(tattooData);
        const highlights = {}; // To track applied highlights

        zones.forEach(zone => {
            highlights[zone] = new Array(tattooData[zone].length).fill(false);
        });

        // Elements
        const zoneSlider = document.getElementById('zone-slider');
        const zoneName = document.getElementById('zone-name');
        const tattooSlider = document.getElementById('tattoo-slider');
        const tattooName = document.getElementById('tattoo-name');
        const applyButton = document.getElementById('apply-button');
        const removeButton = document.getElementById('remove-button');
        const exitButton = document.getElementById('exit-button');

        let currentZone = 0;
        let currentTattoo = 0;
        
        function updateTattooData(json){
            const data = JSON.parse(json);
            tattooData = data;
            
        }

        // Update tattoo and zone displays
        function updateDisplays() {
            const zone = zones[currentZone];
            const tattoo = tattooData[zone][currentTattoo];
            zoneName.textContent = zone;
            tattooName.textContent = tattoo;

            // Highlight if applied
            if (highlights[zone][currentTattoo]) {
                tattooName.classList.add('highlighted');
            } else {
                tattooName.classList.remove('highlighted');
            }

            // Adjust tattoo slider range
            tattooSlider.max = tattooData[zone].length - 1;
        }

        // Event listeners
        zoneSlider.addEventListener('input', () => {
            currentZone = parseInt(zoneSlider.value, 10);
            currentTattoo = 0;
            tattooSlider.value = 0;
            updateDisplays();
        });

        tattooSlider.addEventListener('input', () => {
            currentTattoo = parseInt(tattooSlider.value, 10);
            // Remove the previously applied tattoo before applying the new one
            mp.trigger("CEF:CLIENT:RemoveTattoo", tattooName.textContent);

            // Apply the new tattoo as you move the slider
            
            updateDisplays();
            mp.trigger("CEF:CLIENT:ApplyTattoo", tattooName.textContent);
        });

        applyButton.addEventListener('click', () => {
            highlights[zones[currentZone]][currentTattoo] = true;
            mp.trigger("CEF:CLIENT:ApplyTattoo", tattooName.textContent);
            updateDisplays();
        });

        removeButton.addEventListener('click', () => {
            highlights[zones[currentZone]][currentTattoo] = false;
            mp.trigger("CEF:CLIENT:RemoveTattoo", tattooName.textContent);
            updateDisplays();
        });
