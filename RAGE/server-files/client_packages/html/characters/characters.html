<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Fields</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            background-color: rgba(0, 0, 0, 0);
        }

        .container {
            margin-left: 50px; /* Positions the container a few centimeters from the left edge */
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .account-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        .field {
            width: 250px;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #e9e9e9;
            cursor: pointer;
            text-align: left;
        }

        .create-button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="accountInfo">
            <div id="accountName" class="account-name"></div>
            <div id="characters"></div>
        </div>
        <!-- Create Character Button -->
        <button class="create-button" onclick="createCharacter()">Create Character</button>
    </div>

    <script>
        function displayAccountInfo(accountName, charNames, money) {
            // Display the account name
            const accountNameDiv = document.getElementById('accountName');
            accountNameDiv.textContent = `Account Name: ${accountName}`;

            // Clear previous character info
            const charactersDiv = document.getElementById('characters');
            charactersDiv.innerHTML = ''; // Clear existing character info

            // Loop through characters and money to create display elements
            for (let i = 0; i < charNames.length; i++) {
                const charName = charNames[i];
                const charMoney = money[i];

                // Create a div for each character
                const characterDiv = document.createElement('div');
                characterDiv.className = 'field';
                characterDiv.textContent = `Character Name: ${charName} - Money: $${charMoney}`;
                characterDiv.onclick = () => selectCharacter(charName); // Attach the click event

                // Append to the characters div
                charactersDiv.appendChild(characterDiv);
            }
        }
        function selectCharacter(characterName) {
            mp.trigger("CEF:CLIENT:CharacterSelected", characterName);
            mp.trigger("CEF:CLIENT:CloseCharInterface");
            
            //mp.trigger("CEF:CLIENT:showCustomizeCharScreen");
        }

        function createCharacter() {
            mp.trigger("CEF:CLIENT:CloseCharInterface");
            mp.trigger("CEF:CLIENT:ShowCreateCharScreen");
            
            // Functionality to create a new character goes here
        }
    </script>
</body>
</html>
