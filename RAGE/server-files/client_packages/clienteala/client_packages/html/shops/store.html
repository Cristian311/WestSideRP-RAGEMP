<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Store Interface</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="store-container">
        <div class="store-header">
            <h1>Store</h1>
            <button class="exit-btn" onclick="exitStore()">X</button>
        </div>
        <div class="content">
            <div class="store-menu" id="store-menu">
                <!-- Store items will be dynamically added here -->
            </div>
            <div class="cart-menu">
                <div class="cart-header">
                    <h2>Shopping Cart</h2>
                </div>
                <div class="cart-items-container" id="cart-items"></div>
                <select id="payment-method" class="dropdown">
                    <option value="cash">Cash</option>
                    <option value="card">Card</option>
                </select>
                <p id="payment-warning" style="color: red; font-size: 0.9em; display: none; margin-top: 5px;"></p>
                <div class="total">Total: $<span id="total-cost">0</span></div>
                <button class="checkout-btn" onclick="checkout()">Checkout</button>
            </div>
        </div>
        <!-- Move add-item-section outside of cart menu -->
        <div class="add-item-section" id="add-item-section" style="display: none;">
            <button class="add-item-btn" onclick="toggleAddItemForm()">Add New Item</button>
            <div class="add-item-form" id="add-item-form" style="display: none;">
                <input type="text" id="new-item-name" placeholder="Item Name" />
                <input type="number" id="new-item-price" placeholder="Item Price" />
                <select id="new-item-type">
                    <option value="food">Food</option>
                    <option value="drink">Drink</option>
                    <option value="other">Other</option>
                </select>
                <input type="text" id="new-item-image" placeholder="Image Type" />
                <button onclick="addItem()">Add Item</button>
            </div>
        </div>
    </div>

    <script>
        let cart = {};
        let totalCost = 0;
        let isAdmin = false;

        const imageMapping = {
            // Food items
            'burger': './images/burger.png',
            'pizza': './images/pizza.png',
            'sandwich': './images/sandwich.png',
            'salad': './images/salad.png',
            
            // Drinks
            'coffee': './images/coffee.png',
            'soda': './images/soda.png',
            'water': './images/water.png',
            'juice': './images/juice.png',

            'redwood': './images/redwood.png',
            'milk': './images/milk.png',
            'cards': './images/pack_of_cards.png',
            'shaorma': './images/shaorma.png',
            'fries': './images/fries.png',
            'lighter': './images/lighter.png',
            'chips': './images/chips.png',
            // Default fallback image
            'default': './images/default.png'
        };

        // Initialize with sample items including image-type
        const initialItems = [
            
        ];

        function initializeStore() {
            const storeMenu = document.getElementById('store-menu');
            storeMenu.innerHTML = '';
            initialItems.forEach(item => {
                const newItem = createStoreItem(item.name, item.price, item.type, item.imageType);
                storeMenu.appendChild(newItem);
            });
        }

        function getImagePath(imageType) {
            return imageMapping[imageType] || imageMapping['default'];
        }

        // Update createStoreItem function to use the image mapping
        function createStoreItem(name, price, type, imageType) {
            const div = document.createElement('div');
            div.className = 'store-item';
            
            const imagePath = getImagePath(imageType);
            
            div.innerHTML = `
                <img src="${imagePath}" 
                     alt="${imageType}" 
                     class="item-image" 
                     data-image-type="${imageType}"
                     onerror="this.src='${imageMapping['default']}'">
                <span class="item-type">${type}</span>
                <span class="item-name">${name}</span>
                <span class="item-price">$${price}</span>
            `;
            div.onclick = () => addToCart(name, price, type, imageType);
            return div;
        }
        function updateCart() {
            const cartContainer = document.getElementById('cart-items');
            cartContainer.innerHTML = ''; // Clear existing cart items

            for (const [itemName, itemDetails] of Object.entries(cart)) {
                const cartItemDiv = document.createElement('div');
                cartItemDiv.className = 'cart-item';

                cartItemDiv.innerHTML = `
                    <span class="cart-item-name">${itemName}</span>
                    <span class="cart-item-quantity">x${itemDetails.quantity}</span>
                    <span class="cart-item-price">$${(itemDetails.price * itemDetails.quantity).toFixed(2)}</span>
                    <button class="remove-item-btn" onclick="removeFromCart('${itemName}')">Remove</button>
                `;
                cartContainer.appendChild(cartItemDiv);
            }

            // Update the total cost display
            document.getElementById('total-cost').textContent = totalCost.toFixed(2);

            // Log cart state for debugging
            console.log("Cart updated:", cart);
        }

        function addToCart(item, price, type, imageType) {
            if (cart[item]) {
                cart[item].quantity++;
            } else {
                cart[item] = { price, quantity: 1, type, imageType };
            }
            totalCost += price;
            updateCart();
        }

        function checkout() {
            const paymentMethod = document.getElementById('payment-method').value;
            const paymentWarning = document.getElementById('payment-warning');

            if (!paymentMethod) {
                paymentWarning.textContent = 'Please select a payment method to proceed.';
                paymentWarning.style.display = 'block';
                return;
            }

            // Clear warning if payment method is selected
            paymentWarning.style.display = 'none';

            const cartItems = [];
            for (const [item, details] of Object.entries(cart)) {
                cartItems.push({
                    name: item,
                    price: details.price,
                    quantity: details.quantity,
                    type: details.type,
                    imageType: details.imageType,
                    totalPrice: details.price * details.quantity
                });
            }

            const checkoutData = {
                items: cartItems,
                totalCost: totalCost,
                paymentMethod: paymentMethod
            };

            mp.trigger("CEF:CLIENT:BuyShopItems", JSON.stringify(checkoutData));

            cart = {};
            totalCost = 0;
            updateCart();
        }


        function removeFromCart(item) {
            if (cart[item]) {
                totalCost -= cart[item].price;
                cart[item].quantity--;
                if (cart[item].quantity <= 0) {
                    delete cart[item];
                }
                updateCart();
            }
        }

        function toggleAddItemForm() {
            const form = document.getElementById('add-item-form');
            form.style.display = form.style.display === 'none' || form.style.display === '' ? 'flex' : 'none';
        }

        function addItem() {
            const name = document.getElementById('new-item-name').value;
            const price = parseFloat(document.getElementById('new-item-price').value);
            const type = document.getElementById('new-item-type').value;
            const imageType = document.getElementById('new-item-image').value;

            if (name && price && price > 0 && imageType) {
                const storeMenu = document.getElementById('store-menu');
                const newItem = createStoreItem(name, price, type, imageType);
                storeMenu.appendChild(newItem);

                document.getElementById('new-item-name').value = '';
                document.getElementById('new-item-price').value = '';
                document.getElementById('new-item-image').value = '';
                toggleAddItemForm();

                saveItemData();
            } else {
                alert('Please enter valid item details.');
            }
        }

        function saveItemData() {
            let itemsList = [];
            const storeItems = document.querySelectorAll('.store-item');

            storeItems.forEach(item => {
                const name = item.querySelector('.item-name').textContent;
                const price = parseFloat(item.querySelector('.item-price').textContent.replace('$', ''));
                const type = item.querySelector('.item-type').textContent;
                const imageType = item.querySelector('.item-image').getAttribute('data-image-type');

                itemsList.push({
                    Name: name,
                    Type: type,
                    Cost: price,
                    ImageType: imageType
                });
            });

            const jsonItems = JSON.stringify(itemsList);
            mp.trigger("CEF:CLIENT:SaveItemData", jsonItems);
        }

        function UpdateItems(json) {
            console.log("UpdateItems called with:", json); // Debug log
            try {
                const itemData = JSON.parse(json);
                const storeMenu = document.getElementById('store-menu');
                storeMenu.innerHTML = '';

                itemData.forEach(item => {
                    const newItem = createStoreItem(item.Name, item.Cost, item.Type, item.ImageType);
                    storeMenu.appendChild(newItem);
                });
            } catch (error) {
                console.error("Error updating items:", error);
            }
        }

        function checkout() {
            const paymentMethod = document.getElementById('payment-method').value;

            if (!paymentMethod) {
                alert('Please select a payment method before checking out.');
                return;
            }

            const cartItems = [];
            for (const [item, details] of Object.entries(cart)) {
                cartItems.push({
                    name: item,
                    price: details.price,
                    quantity: details.quantity,
                    type: details.type,
                    imageType: details.imageType,
                    totalPrice: details.price * details.quantity
                });
            }

            const checkoutData = {
                items: cartItems,
                totalCost: totalCost,
                paymentMethod: paymentMethod
            };

            mp.trigger("CEF:CLIENT:BuyShopItems", JSON.stringify(checkoutData));

            cart = {};
            totalCost = 0;
            updateCart();
        }

        function exitStore() {
            let itemsList = [];
            const storeItems = document.querySelectorAll('.store-item');

            storeItems.forEach(item => {
                const name = item.querySelector('.item-name').textContent;
                const price = parseFloat(item.querySelector('.item-price').textContent.replace('$', ''));
                const type = item.querySelector('.item-type').textContent;
                const imageType = item.querySelector('.item-image').getAttribute('data-image-type');

                itemsList.push({
                    Name: name,
                    Type: type,
                    Cost: price,
                    ImageType: imageType
                });
            });

            const jsonItems = JSON.stringify(itemsList);
            mp.trigger("CEF:CLIENT:CloseShop", jsonItems);
            document.querySelector('.store-container').style.display = 'none';
        }

        function toggleAdmin(show) {
            console.log("toggleAdmin called with:", show); // Debug log
            isAdmin = show === true || show === "true";
            const addItemSection = document.getElementById('add-item-section');
            const typeLabels = document.querySelectorAll('.item-type');

            if (isAdmin) {
                addItemSection.style.display = 'block';
                typeLabels.forEach(label => {
                    label.style.display = 'block';
                });
            } else {
                addItemSection.style.display = 'none';
                typeLabels.forEach(label => {
                    label.style.display = 'none';
                });
            }
        }

        $(document).ready(function() {
            $('#payment-method').select2({
                placeholder: "Select payment method",
                allowClear: true
            }).on('change', function() {
                const paymentMethod = $(this).val();
                const checkoutButton = document.querySelector('.checkout-btn');
                const paymentWarning = document.getElementById('payment-warning');

                checkoutButton.disabled = !paymentMethod;

                // Hide warning message if a payment method is selected
                if (paymentMethod) {
                    paymentWarning.style.display = 'none';
                }
            });

            $('#new-item-type').select2({
                placeholder: "Select item type",
                allowClear: true
            });

            initializeStore();
            

            // Initially disable the checkout button
            document.querySelector('.checkout-btn').disabled = true;
        });

    </script>
</body>
</html>
